name: kaitai_compress

on:
  push:
    branches: [master]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kaitai-struct-compiler
        run: |
          curl -fsSL -O https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler_0.11_all.deb
          sha256sum --check --strict .github/checksums
          sudo apt-get update
          sudo apt-get install -y ./kaitai-struct-compiler_0.11_all.deb
      - name: Compile ksy into target languages
        working-directory: _test
        run: ./compile-ksy
      - uses: actions/upload-artifact@v4
        with:
          name: compiled
          path: _test/compiled

  python:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled
          path: _test/compiled
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r _test/requirements-python.txt
      - run: _test/run-python

  ruby:
    needs: compile
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/_test/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled
          path: _test/compiled
      - run: sudo apt-get update && sudo apt-get install -y libsnappy-dev libbz2-dev liblzma-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - working-directory: _test
        run: bundle exec ./run-ruby

  javascript:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled
          path: _test/compiled
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: javascript
        run: npm install
      - working-directory: _test
        run: ./run-javascript

  docker:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: compiled
          path: _test/compiled
      - name: Build all Docker images
        working-directory: _test/docker
        run: DOCKER_ENGINE=docker ./build-images
      - name: Test on python/3.12
        working-directory: _test/docker
        run: DOCKER_ENGINE=docker ./dockerci python/3.12
      - name: Test on ruby/3.2
        working-directory: _test/docker
        run: DOCKER_ENGINE=docker ./dockerci ruby/3.2
      - name: Test on javascript/nodejs22
        working-directory: _test/docker
        run: DOCKER_ENGINE=docker ./dockerci javascript/nodejs22
